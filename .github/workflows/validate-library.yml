name: Validate Library app

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate app JavaScript, instruction page, PWA, SEO and uploads
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const inlineScripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
          let parsedInlineScripts = 0;
          for (const match of inlineScripts) {
            if (/\btype=["']application\/ld\+json["']/i.test(match[1])) continue;
            if (match[2].trim()) { new Function(match[2]); parsedInlineScripts++; }
          }
          if (parsedInlineScripts < 2) throw new Error('Expected both the splash loader and main app JavaScript');
          new Function(fs.readFileSync('upload-config.js', 'utf8'));
          console.log('Inline app, splash loader, and upload-config JavaScript syntax: OK');
          const { execFileSync } = require('node:child_process');
          execFileSync('node', ['--input-type=module', '--check'], { input: fs.readFileSync('upload-worker/worker.js', 'utf8') });
          console.log('Cloudflare Worker module syntax: OK');

          const requiredUi = [
            'data-nav="home"', 'data-nav="library"', 'data-nav="prompts"', 'data-nav="you"',
            'id="navIndicator"', 'function updateNavIndicator', 'id="shareBackdrop"',
            'id="shareNowBtn"', 'id="uploadCta"', 'id="installAppBtn"', 'id="homeMore"',
            'id="installBanner"', 'id="accountPanel"', 'function openAuthModal()',
            'sb("signup","POST",{email,password,data:{display_name:name}})', 'sb("token?grant_type=password","POST",{email,password},"")', 'xhr.open("POST",apiBase()+"/upload")', 'fetch(apiBase()+"/upload/review"', 'id="uploadFilePreview"', 'function extractStudyText(file)', 'uploadReviewDone', 'buildUploadedFilesPrompt', 'Use in ChatGPT', 'Confirm title & upload', 'Need help? Open the Library guide',
            'INSTRUCTION_URL="https://squashberry.github.io/Read/gptinstruction/index.html"',
            '$("chatLibraryBtn").addEventListener("click",()=>openChat(basePrompt()));',
             'const modeLabels={read:"Read",lecture:"Lecture",exam:"Exam",flashcards:"Flashcards",summary:"Summary"}',
            'Topic, file name or code (e.g. 012)', 'showPopupThisVisit', 'library-popup-visits', 'toast.timer=setTimeout(()=>node.classList.remove("show"),20000)',
            'async function toggleDailyReminders()', 'vapidPublicKey',
            'property="og:image"', 'name="twitter:card"', 'application/ld+json',
            'id="splashBoot"', 'href="./splash.js" as="script"', 'overflow-x:clip'
          ];
          for (const marker of requiredUi) {
            if (!html.includes(marker)) throw new Error('Missing app requirement: ' + marker);
          }
          if (!fs.readFileSync('sw.js', 'utf8').includes('shell-v14')) throw new Error('Service worker cache version was not refreshed');
          if (html.includes('Skip intro') || html.includes('skip:function')) throw new Error('The cinematic splash must not have a skip path');
          if (!fs.readFileSync('sw.js', 'utf8').includes('./splash.js')) throw new Error('The splash script must be precached by the service worker');
          const splash = fs.readFileSync('splash.js', 'utf8');
          new Function(splash);
          if (splash.includes('end(true)') || splash.includes('onKey')) throw new Error('The splash script still contains a user or automatic skip path');
          console.log('Splash download, full-playback and no-skip checks: OK');
          if (html.includes('id="splash"') || html.includes('class="splash-byline"')) throw new Error('Legacy static splash must be removed; use the cinematic intro only');
          if (html.includes('Start by asking me whether I want to see all available files, find a topic, or study a specific file number.')) {
            throw new Error('The home ChatGPT launcher must not append the forced three-choice opener');
          }
          if (html.includes('id="repoLink"') || html.includes('Open website ↗')) {
            throw new Error('Redundant Open website link remains in the UI');
          }
          if (html.includes('githubToken') || html.includes('githubRequest(') || html.includes('function handleUpload()')) {
            throw new Error('Legacy client-side GitHub token uploader should not be present');
          }
          if (html.includes('onrender.com')) throw new Error('The app source must not depend on Render hosting.');

          const guide = fs.readFileSync('gptinstruction/index.html', 'utf8');
          const guideLower = guide.toLowerCase();
          if (!guideLower.includes('show me the files') || !guideLower.includes('find a topic') || !guideLower.includes('study a file number')) {
            throw new Error('The ChatGPT instruction page is missing simple learner paths');
          }
          if (!guide.includes('../?upload=1')) throw new Error('The instruction page has no direct upload link');
          if (!guide.includes('Exam mode 011') ||
              !guide.includes('deliberately short') ||
              !guide.includes('Never assume a transcript exists or guess its path.')) {
            throw new Error('The study guide is missing concise mode commands or source-resolution rules');
          }
          const promptStart = html.indexOf('function promptFor(mode,file){');
          const promptEnd = html.indexOf('function startStudy(mode)', promptStart);
          const filePrompt = html.slice(promptStart, promptEnd);
          if (promptStart < 0 || promptEnd < 0 ||
              !filePrompt.includes('const command=file?') ||
              /rawFileUrl|transcriptPath|Task:/.test(filePrompt)) {
            throw new Error('File prompts should contain only the instruction link and a short mode/file-ID command');
          }
          const uploadedPromptStart = html.indexOf('function buildUploadedFilesPrompt(uploaded){');
          const uploadedPromptEnd = html.indexOf('async function handleEasyUpload(cfg)', uploadedPromptStart);
          const uploadedPrompt = html.slice(uploadedPromptStart, uploadedPromptEnd);
          if (uploadedPromptStart < 0 || uploadedPromptEnd < 0 ||
              !uploadedPrompt.includes('Study files ') ||
              /rawFileUrl|transcriptPath/.test(uploadedPrompt)) {
            throw new Error('Bulk-upload prompts must use file IDs and the central guide instead of embedding source URLs');
          }
          const guideScriptStart = guide.indexOf('<script>');
          const guideScriptEnd = guide.indexOf('</script>', guideScriptStart);
          if (guideScriptStart >= 0 && guideScriptEnd > guideScriptStart) {
            new Function(guide.slice(guideScriptStart + '<script>'.length, guideScriptEnd));
          }
          console.log('Readable study guide and links: OK');

          const manifest = JSON.parse(fs.readFileSync('manifest.webmanifest', 'utf8'));
          if (manifest.display !== 'standalone' || manifest.scope !== './') {
            throw new Error('PWA manifest must use standalone display and repository-relative scope');
          }
          for (const file of ['sw.js', 'splash.js', 'icon.svg', 'og-image.svg', 'upload-config.js', 'upload-worker/worker.js', 'upload-worker/schema.sql', 'upload-worker/README.md', 'robots.txt', 'sitemap.xml', '.nojekyll']) {
            if (!fs.existsSync(file)) throw new Error('Missing app asset: ' + file);
          }
          const worker = fs.readFileSync('upload-worker/worker.js', 'utf8');
          if (!worker.includes('"/upload/review"') || !worker.includes('GEMINI_API_KEY') || !worker.includes('reviewTokens') || !worker.includes('study-text/') || !worker.includes('aiFileReview')) {
            throw new Error('Upload Worker is missing AI-review or readable-transcript support');
          }
          const uploadHandlerStart = worker.indexOf('async function handleUpload(request, env) {');
          const uploadHandlerEnd = worker.indexOf('\nfunction base64UrlDecode(value)', uploadHandlerStart);
          if (uploadHandlerStart < 0 || uploadHandlerEnd < 0 || worker.slice(uploadHandlerStart, uploadHandlerEnd).includes('verifyTurnstile')) {
            throw new Error('File uploads must not require the sign-in Turnstile widget');
          }
          if (!worker.includes('UPLOAD_RATE_LIMIT') || !worker.includes('MAX_FILE_BYTES') ||
              !worker.includes('SUPABASE_URL') || !worker.includes('SUPABASE_PUBLISHABLE_KEY') ||
              !worker.includes('/auth/me') || !worker.includes('/auth/dashboard') ||
              !worker.includes('getSessionUser(request,env)') || !worker.includes('/push/subscribe') ||
              !worker.includes('async scheduled(controller,env,ctx)') || !worker.includes('titleConfirmationFallback') ||
              !worker.includes('user-agent') || !worker.includes('async function verifyHmacHex(') ||
              !worker.includes('crypto.subtle.verify("HMAC"') ||
              !worker.includes('await verifyHmacHex(secret, pieces[0], pieces[1])') || worker.includes('timingSafeEqual(')) {
            throw new Error('Upload Worker is missing Supabase auth, upload safety, or Workers-compatible review-token verification');
          }
          const verifyStart = worker.indexOf('async function verifyHmacHex(');
          const verifyEnd = worker.indexOf('\nasync function signReviewPayload(', verifyStart);
          if (verifyStart < 0 || verifyEnd < 0) throw new Error('Workers Web Crypto review verifier could not be isolated');
          const verifierSource = worker.slice(verifyStart, verifyEnd);
          const verifyHmacHex = new Function('crypto', 'TextEncoder', verifierSource + '; return verifyHmacHex;')(require('node:crypto').webcrypto, TextEncoder);
          (async () => {
            const testCrypto = require('node:crypto').webcrypto;
            const secret = 'library-upload-review-test-secret';
            const payload = 'review-token-payload';
            const key = await testCrypto.subtle.importKey('raw', new TextEncoder().encode(secret), {name:'HMAC',hash:'SHA-256'}, false, ['sign']);
            const signature = await testCrypto.subtle.sign('HMAC', key, new TextEncoder().encode(payload));
            const signatureHex = Array.from(new Uint8Array(signature), byte => byte.toString(16).padStart(2,'0')).join('');
            if (!await verifyHmacHex(secret, payload, signatureHex)) throw new Error('Valid review-token HMAC was rejected');
            if (await verifyHmacHex(secret, payload + '-tampered', signatureHex)) throw new Error('Tampered review-token payload was accepted');
            if (await verifyHmacHex(secret, payload, 'not-a-signature')) throw new Error('Malformed review-token signature was accepted');
            console.log('Workers Web Crypto review-token verification: OK');
          })().catch(error => { console.error(error); process.exitCode = 1; });
          const schema = fs.readFileSync('upload-worker/schema.sql', 'utf8');
          if (!schema.includes('password_salt TEXT') || !schema.includes('password_hash TEXT')) throw new Error('D1 schema is missing password authentication columns');
          const passwordMigration = fs.readFileSync('upload-worker/migrations/0002_password_auth.sql', 'utf8');
          if (!/ADD COLUMN password_salt/i.test(passwordMigration) || !/ADD COLUMN password_hash/i.test(passwordMigration)) throw new Error('Existing-database password migration is incomplete');
          for (const table of ['users', 'sessions', 'uploads', 'activity', 'id_counters', 'push_subscriptions']) {
            if (!schema.includes('CREATE TABLE IF NOT EXISTS ' + table)) throw new Error('D1 schema is missing the ' + table + ' table');
          }
          const sitemap = fs.readFileSync('sitemap.xml', 'utf8');
          if (!sitemap.includes('https://squashberry.github.io/Read/') || !sitemap.includes('https://squashberry.github.io/Read/gptinstruction/')) {
            throw new Error('Sitemap is missing one or more public app pages');
          }
          const uploadSectionStart = html.indexOf('let uploadQueue=[];');
          const uploadSectionEnd = html.indexOf('const SHARE_URL=', uploadSectionStart);
          if (uploadSectionStart < 0 || uploadSectionEnd < 0 || /turnstile|captcha/i.test(html.slice(uploadSectionStart, uploadSectionEnd))) {
            throw new Error('The uploader must not load or require Cloudflare Turnstile');
          }
          if (!html.includes('function supabaseAuthConfigured()') ||
              !html.includes('sb("signup","POST",{email,password,data:{display_name:name}})') ||
              !html.includes('token?grant_type=password')) {
            throw new Error('Browser sign-in must use Supabase Auth directly');
          }
          console.log('PWA, social preview, sitemap, and secure upload Worker assets: OK');

          const registry = JSON.parse(fs.readFileSync('library-index.json', 'utf8'));
          if (!Array.isArray(registry.items)) throw new Error('Catalogue has no items array');
          const ids = registry.items.map(item => String(item.id));
          if (new Set(ids).size !== ids.length) throw new Error('Duplicate file IDs found');
          const missing = registry.items.filter(item => !item.id || !item.name || !item.path || item.kind !== 'study-material');
          if (missing.length) throw new Error('Catalogue entries are missing required study-material metadata');
          console.log('Catalogue OK: ' + registry.items.length + ' uniquely numbered learning files.');
          const registeredPaths = new Set(registry.items.map(item => item.path));
          const sourceDocuments = fs.readdirSync('.').filter(name => /\\.(pdf|ppt|pptx|doc|docx|rtf)$/i.test(name));
          const unregisteredDocuments = sourceDocuments.filter(name => !registeredPaths.has(name));
          if (unregisteredDocuments.length) throw new Error('Study documents are missing from library-index.json: ' + unregisteredDocuments.join(', '));
          for (const item of registry.items) {
            if (!fs.existsSync(item.path)) throw new Error('Catalogue source file is missing: ' + item.path);
            if (Number.isFinite(Number(item.size)) && fs.statSync(item.path).size !== Number(item.size)) throw new Error('Catalogue size does not match source file: ' + item.path);
          }
          for (const item of registry.items) {
            if (item.transcriptPath) {
              const expectedTranscript = 'study-text/' + String(item.id).padStart(3, '0') + '.md';
              if (item.transcriptPath !== expectedTranscript) throw new Error('Unexpected transcript path for file ' + item.id);
              if (!fs.existsSync(item.transcriptPath)) throw new Error('Missing registered transcript: ' + item.transcriptPath);
            }
          }
          console.log('Optional transcript links: OK; only files with actual transcripts are linked.');
          for (const item of registry.items) {
            if (!item.transcriptPath) continue; // Newly uploaded files may have only their original source URL.
            const id = String(item.id).padStart(3, '0');
            const transcriptPath = 'study-text/' + id + '.md';
            if (item.transcriptPath !== transcriptPath) throw new Error('Unexpected transcript path for file ' + id);
            if (!fs.existsSync(transcriptPath)) throw new Error('Missing registered transcript: ' + transcriptPath);
            const transcript = fs.readFileSync(transcriptPath, 'utf8');
            if (!transcript.includes('Study text: File ' + id) || !transcript.includes('Original PowerPoint:')) {
              throw new Error('Registered transcript has missing source metadata: ' + transcriptPath);
            }
          }
          console.log('Registered optional study transcripts: OK.');
          NODE
