name: Validate Library app

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate app JavaScript, instruction page, PWA, SEO and uploads
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const start = html.indexOf('<script>');
          const end = html.indexOf('</script>', start);
          if (start < 0 || end < 0) throw new Error('Inline app JavaScript not found');
          new Function(html.slice(start + '<script>'.length, end));
          new Function(fs.readFileSync('upload-config.js', 'utf8'));
          console.log('App and upload-config JavaScript syntax: OK');
          const { execFileSync } = require('node:child_process');
          execFileSync('node', ['--input-type=module', '--check'], { input: fs.readFileSync('upload-worker/worker.js', 'utf8') });
          console.log('Cloudflare Worker module syntax: OK');

          const requiredUi = [
            'data-nav="home"', 'data-nav="library"', 'data-nav="prompts"', 'data-nav="you"',
            'id="navIndicator"', 'function updateNavIndicator', 'id="shareBackdrop"',
            'id="shareNowBtn"', 'id="uploadCta"', 'id="installAppBtn"', 'id="homeMore"',
            'id="installBanner"', 'id="accountPanel"', 'function openAuthModal()',
            'apiFetch("/auth/request-code"', 'apiFetch("/auth/verify-code"', 'fetch(apiBase()+"/upload"',
            'INSTRUCTION_URL="https://squashberry.github.io/Read/gptinstruction/index.html"',
            '$("chatLibraryBtn").addEventListener("click",()=>openChat(basePrompt()));',
            'rawFileUrl(file.path)', 'sourceItem&&sourceItem.transcriptPath',
            'Search topics or file code', 'showPopupThisVisit', 'library-popup-visits', 'toast.timer=setTimeout(()=>node.classList.remove("show"),20000)',
            'async function toggleDailyReminders()', 'vapidPublicKey',
            'property="og:image"', 'name="twitter:card"', 'application/ld+json',
            'class="splash-byline"'
          ];
          for (const marker of requiredUi) {
            if (!html.includes(marker)) throw new Error('Missing app requirement: ' + marker);
          }
          if (html.includes('Start by asking me whether I want to see all available files, find a topic, or study a specific file number.')) {
            throw new Error('The home ChatGPT launcher must not append the forced three-choice opener');
          }
          if (html.includes('id="repoLink"') || html.includes('Open website ↗')) {
            throw new Error('Redundant Open website link remains in the UI');
          }
          if (html.includes('githubToken') || html.includes('githubRequest(') || html.includes('function handleUpload()')) {
            throw new Error('Legacy client-side GitHub token uploader should not be present');
          }
          if (html.includes('onrender.com')) throw new Error('The app source must not depend on Render hosting.');

          const guide = fs.readFileSync('gptinstruction/index.html', 'utf8');
          const guideLower = guide.toLowerCase();
          if (!guideLower.includes('show me the files') || !guideLower.includes('find a topic') || !guideLower.includes('study a file number')) {
            throw new Error('The ChatGPT instruction page is missing simple learner paths');
          }
          if (!guide.includes('../?upload=1')) throw new Error('The instruction page has no direct upload link');
          if (!guide.includes('A file-specific ChatGPT prompt already supplies this URL') ||
              !guide.includes('never assume a transcript exists or guess its path')) {
            throw new Error('The study guide is missing direct source-link or optional transcript instructions');
          }
          const guideScriptStart = guide.indexOf('<script>');
          const guideScriptEnd = guide.indexOf('</script>', guideScriptStart);
          if (guideScriptStart >= 0 && guideScriptEnd > guideScriptStart) {
            new Function(guide.slice(guideScriptStart + '<script>'.length, guideScriptEnd));
          }
          console.log('Readable study guide and links: OK');

          const manifest = JSON.parse(fs.readFileSync('manifest.webmanifest', 'utf8'));
          if (manifest.display !== 'standalone' || manifest.scope !== './') {
            throw new Error('PWA manifest must use standalone display and repository-relative scope');
          }
          for (const file of ['sw.js', 'icon.svg', 'og-image.svg', 'upload-config.js', 'upload-worker/worker.js', 'upload-worker/schema.sql', 'upload-worker/README.md', 'robots.txt', 'sitemap.xml', '.nojekyll']) {
            if (!fs.existsSync(file)) throw new Error('Missing app asset: ' + file);
          }
          const worker = fs.readFileSync('upload-worker/worker.js', 'utf8');
          if (!worker.includes('TURNSTILE_SECRET_KEY') || !worker.includes('UPLOAD_RATE_LIMIT') || !worker.includes('MAX_FILE_BYTES') ||
              !worker.includes('/auth/request-code') || !worker.includes('/auth/verify-code') || !worker.includes('/auth/dashboard') ||
              !worker.includes('getSessionUser(request,env)') || !worker.includes('/push/subscribe') || !worker.includes('async scheduled(controller,env,ctx)') || !worker.includes('welcomeEmailHtml(displayName)')) {
            throw new Error('Upload Worker is missing authentication or upload safety controls');
          }
          const schema = fs.readFileSync('upload-worker/schema.sql', 'utf8');
          for (const table of ['users', 'login_codes', 'sessions', 'uploads', 'activity', 'id_counters', 'push_subscriptions']) {
            if (!schema.includes('CREATE TABLE IF NOT EXISTS ' + table)) throw new Error('D1 schema is missing the ' + table + ' table');
          }
          const sitemap = fs.readFileSync('sitemap.xml', 'utf8');
          if (!sitemap.includes('https://squashberry.github.io/Read/') || !sitemap.includes('https://squashberry.github.io/Read/gptinstruction/')) {
            throw new Error('Sitemap is missing one or more public app pages');
          }
          console.log('PWA, social preview, sitemap, and secure upload Worker assets: OK');

          const registry = JSON.parse(fs.readFileSync('library-index.json', 'utf8'));
          if (!Array.isArray(registry.items)) throw new Error('Catalogue has no items array');
          const ids = registry.items.map(item => String(item.id));
          if (new Set(ids).size !== ids.length) throw new Error('Duplicate file IDs found');
          const missing = registry.items.filter(item => !item.id || !item.name || !item.path || item.kind !== 'study-material');
          if (missing.length) throw new Error('Catalogue entries are missing required study-material metadata');
          console.log('Catalogue OK: ' + registry.items.length + ' uniquely numbered learning files.');
          for (const item of registry.items) {
            if (item.transcriptPath) {
              const expectedTranscript = 'study-text/' + String(item.id).padStart(3, '0') + '.md';
              if (item.transcriptPath !== expectedTranscript) throw new Error('Unexpected transcript path for file ' + item.id);
              if (!fs.existsSync(item.transcriptPath)) throw new Error('Missing registered transcript: ' + item.transcriptPath);
            }
          }
          console.log('Optional transcript links: OK; only files with actual transcripts are linked.');
          for (const item of registry.items) {
            if (!item.transcriptPath) continue; // Newly uploaded files may have only their original source URL.
            const id = String(item.id).padStart(3, '0');
            const transcriptPath = 'study-text/' + id + '.md';
            if (item.transcriptPath !== transcriptPath) throw new Error('Unexpected transcript path for file ' + id);
            if (!fs.existsSync(transcriptPath)) throw new Error('Missing registered transcript: ' + transcriptPath);
            const transcript = fs.readFileSync(transcriptPath, 'utf8');
            if (!transcript.includes('Study text: File ' + id) || !transcript.includes('Original PowerPoint:')) {
              throw new Error('Registered transcript has missing source metadata: ' + transcriptPath);
            }
          }
          console.log('Registered optional study transcripts: OK.');
          NODE
